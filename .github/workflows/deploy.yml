name: Build and deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned: Zola 0.18 emits footnote definitions inline, which breaks
      # the sidenote source and the no-JS fallback. See the typography spec.
      - name: Install Zola
        run: |
          curl -sSfL https://github.com/getzola/zola/releases/download/v0.23.4/zola-v0.23.4-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin zola
          zola --version

      - name: Build
        run: zola build

      # Internal links only: the first essay carries 399 external references
      # and CI must not depend on other people's uptime.
      - name: Check internal links
        run: zola check --skip-external-links

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
