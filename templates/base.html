<!doctype html>
<html lang="{{ config.default_language }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta
      name="description"
      content="{% block description %}{{ config.description }}{% endblock description %}"
    />
    {% if page is defined and page.extra.unlisted %}
    <meta name="robots" content="noindex, nofollow" />
    {% endif %}
    <link rel="stylesheet" href="{{ get_url(path='style.css') }}" />
    <link
      rel="alternate"
      type="application/atom+xml"
      href="{{ get_url(path='atom.xml') }}"
    />
    <script src="{{ get_url(path='js/theme.js') }}"></script>
    {% block head %}{% endblock head %}
  </head>
  <body>
    <a class="skip" href="#content">Skip to content</a>
    <main id="content">
      <header id="masthead">
        <a id="brand" href="{{ get_url(path='@/_index.md') }}"
          >{{ config.title }}</a
        >
      </header>
      <nav id="site-nav">
        <a href="{{ get_url(path='@/essays/_index.md') }}">Essays</a>
        <a href="{{ get_url(path='@/projects/_index.md') }}">Projects</a>
        <a href="{{ get_url(path='@/about.md') }}">About</a>
        <button
          id="theme-toggle"
          type="button"
          aria-label="Switch colour scheme"
        >
          <span aria-hidden="true">◐</span>
        </button>
      </nav>
      {% block content %}{% endblock content %}
      <footer id="site-footer">
        <p>© {{ now() | date(format="%Y") }} {{ config.extra.author }}</p>
      </footer>
    </main>
    <script type="module" src="{{ get_url(path='js/brand.js') }}"></script>
    {% block scripts %}{% endblock scripts %}
  </body>
</html>
