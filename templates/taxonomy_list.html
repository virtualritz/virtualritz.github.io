{% extends "base.html" %}

{% block title %}Tags - {{ config.title }}{% endblock title %}

{% block content %}
<article class="taxonomy-list">
    <header class="page-header">
        <h1>Tags</h1>
        <p class="description">All tags used across the site</p>
    </header>
    
    <div class="tag-cloud">
        {% for term in terms %}
        <a href="{{ term.permalink }}" class="tag-link">
            {{ term.name }}
            <span class="count">({{ term.pages | length }})</span>
        </a>
        {% endfor %}
    </div>
</article>

<style>
.tag-cloud {
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    margin-top: 2rem;
}

.tag-link {
    display: inline-block;
    padding: 0.5rem 1rem;
    background-color: var(--code-bg);
    border: 1px solid var(--border-color);
    border-radius: 5px;
    text-decoration: none;
    font-family: var(--font-sans);
    transition: all 0.2s ease;
}

.tag-link:hover {
    background-color: var(--link-color);
    color: white;
    border-color: var(--link-color);
}

.tag-link .count {
    opacity: 0.7;
    font-size: 0.9em;
    margin-left: 0.25rem;
}
</style>
{% endblock content %}
