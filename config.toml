# The URL the site will be built for
base_url = "https://virtualritz.github.io"

# Site title and description
title = "Virtual Ritz"
description = "Personal website and blog about technology, design, and ideas"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Default language
default_language = "en"

# Taxonomies
taxonomies = [
    {name = "tags", feed = true},
]

[markdown]
# Whether to do syntax highlighting
# Theme can be customised by setting the `highlight_theme` variable to a theme supported by Zola
highlight_code = true
highlight_theme = "base16-ocean-light"

# Whether to render emoji codes
render_emoji = false

# Whether external links are to be opened in a new tab
external_links_target_blank = true

# Whether to set rel="nofollow" for external links
external_links_no_follow = false

# Whether to set rel="noreferrer" for external links
external_links_no_referrer = false

# Whether smart punctuation is enabled
smart_punctuation = true

[extra]
# Put all your custom variables here
author = "Your Name"
